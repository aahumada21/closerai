# Catalogo de variables de decision + cadena de reglas del bot (Ahumada Detailing closer).
#
# Que es esto: un mapa exacto de que variables determinan la respuesta del bot y que
# accion resulta de cada combinacion, extraido leyendo directamente el codigo fuente
# de los nodos de decision (no de memoria ni de docs previos). Sirve para:
#   1. Referencia rapida al arreglar bugs: en vez de releer el JSON crudo del workflow,
#      se busca aca la regla/condicion que gobierna el caso.
#   2. Base para generar QA combinatorio en una fase futura (ver README.md de esta carpeta).
#
# Como se mantiene: cuando cambie `rules_evaluation` (3 rules_engine) o `action_router`
# (6 action_executor), volver a extraer con el mismo metodo (ver "extraction_method" abajo)
# y actualizar `meta.last_verified_against_source`.

meta:
  bot: "Ahumada Detailing - closer conversacional (lavado/detailing de autos)"
  source_files:
    rules_engine: "workflows/exports/uncategorized/3 - 3 rules_engine__id-e88adaaf-dfed-46af-8f5f-4dd73f2cb5c5.json"
    action_executor: "workflows/exports/uncategorized/6 - 6 action_executor__id-80e7685e-2690-4d1e-a5e7-5ccb7d0e8a13.json"
  purpose:
    "3 rules_engine": >
      El "cerebro rapido" del bot: recibe el contexto armado por 2 lead_loader y trata
      de resolver la respuesta con reglas deterministas (sin LLM), evaluando ~54 reglas
      en orden de prioridad hasta que una matchea. Si ninguna matchea, delega a
      5 llm_decision. Es el camino que atiende la enorme mayoria de los mensajes,
      porque es instantaneo y predecible comparado con llamar a un LLM.
    "6 action_executor": >
      Una vez que ya se decidio QUE accion tomar (por regla o por LLM), este workflow
      la ejecuta de verdad: rutea a uno de los 28 sub-workflows 6.x segun la accion
      (enviar un mensaje, crear una reserva, cobrar, derivar a humano, etc.) via el
      Switch action_router, y al final persiste el resultado (6.24 persist_and_audit).
  key_nodes:
    rules_evaluation: "Code node dentro de rules_engine. Contiene ~54 funciones rule*(ctx) evaluadas en orden de prioridad (primer match gana). Ver rule_chain abajo."
    action_router: "Switch node (mode=expression) dentro de action_executor. Mapea rule_result.action -> uno de 20 outputs, cada uno llama a un sub-workflow 6.x."
  last_verified_against_source: "2026-07-18"
  extraction_method: >
    Se extrajo el jsCode real de los nodos (via JSON.parse del export .json, no grep sobre
    el JSON crudo porque jsCode viene como string de una sola linea con \n escapados).
    El orden de rule_chain sale del array literal `const rules = [...]` (evaluado top-to-bottom,
    for...of con `break` en el primer match), NO del orden en que las funciones estan
    definidas en el archivo.

# ---------------------------------------------------------------------------
# VARIABLES
# ---------------------------------------------------------------------------
variables:
  stage:
    source: "lead_state.stage (leido en rules_evaluation como leadState.stage)"
    values:
      - new_lead            # fallback por defecto en algunas funciones (leadState.stage || "new_lead")
      - service_discovery   # estado activo real (asignado por varias reglas); coexiste con new_lead como default -- inconsistencia de nombres a tener presente, no "corregida" aqui
      - qualified
      - quoted
      - closing
      - booking_selection
      - booking_confirmation
      - collecting_address
      - address_confirmation
      - booked
      - cancelling
      - reschedule
      - post_service
      - human_handoff
    note: >
      new_lead y service_discovery se usan ambos como "estado inicial" segun la regla
      (algunas funciones hacen `leadState.stage || "new_lead"`, otras asignan
      `stage: "service_discovery"` explicitamente como salida). No son la misma cadena,
      pero cumplen un rol equivalente. Verificar cual es el valor real que persiste
      lead_state.stage en la practica antes de asumir uno solo al generar QA.

  required_fields_by_stage:
    source: "REQUIRED_FIELDS_BY_STAGE en rules_evaluation, con fallback LEGACY_REQUIRED_FIELDS_BY_STAGE; configurable via agent_rules.lead_required_fields (rule_key='lead_required_fields')"
    default: [service_interest, district, vehicle_type]
    by_stage:
      new_lead: [service_interest, district, vehicle_type]
      qualified: [service_interest, district, vehicle_type]
      quoted: [service_interest, district, vehicle_type]
      closing: [service_interest, district, vehicle_type]
      booking_selection: [service_interest, district, vehicle_type]
      booking_confirmation: [service_interest, district, vehicle_type, booking_date, booking_time]
      collecting_address: [address]
      address_confirmation: []
      booked: []
      cancelling: []
      reschedule: []
      post_service: []
      human_handoff: []

  payment_mode:
    source: "agent_business_config.config (leido por ruleAskPaymentPreference)"
    values: [postpago_only, prepago_only, prepago_required]
    note: "Determina si offer_available_slots se ofrece directo (postpago_only) o si antes hay que preguntar/forzar preferencia de pago (prepago_only / prepago_required) via ask_payment_preference."

  staff_selection_mode:
    source: "agentBusinessConfig.config.staff_selection_mode"
    values: [auto, ask_customer]
    note: "Si hay mas de un staff activo y esta en ask_customer, offer_available_slots pasa primero por seleccion de persona (ruleStaffSelectionReplyProvided)."

  flags:
    - name: human_handoff
      source: "lead_state.human_handoff (boolean)"
      effect: "Si es true, ruleHumanHandoffLocked (prioridad 100, la mas alta) intercepta TODO antes que cualquier otra regla."
    - name: vehicle_type_generic
      source: "isGenericVehicleType() sobre vehicle_type detectado (ej: 'auto', 'vehiculo', 'automovil')"
      effect: "Dispara re-pregunta de tipo de vehiculo especifico en vez de aceptar el valor generico."

# ---------------------------------------------------------------------------
# CATALOGO DE ACCIONES (salida de action_router, Switch node, mode=expression)
# ---------------------------------------------------------------------------
# El mapeo es literal: ({ ask_missing_data: 0, send_quote: 1, ... })[$json.decision.action]
# Indice = output del Switch. Cada output llama a su sub-workflow 6.x.
actions:
  - action: ask_missing_data
    switch_output: 0
    subworkflow: "6.7 ask_missing_data"
    purpose: "Pide al usuario un dato que falta para poder avanzar (servicio, vehiculo, comuna, direccion, etc.)."
  - action: send_quote
    switch_output: 1
    subworkflow: "6.8 send_quote"
    purpose: "Cotiza y envia el precio del servicio (lista completa o un servicio puntual)."
  - action: answer_question
    switch_output: 2
    subworkflow: "6.9 answer_question"
    purpose: "Responde algo generico/informativo que ya viene armado (FAQ, aclaracion, disclosure de que es un bot, etc.) -- el 'catch-all' de mensajeria."
  - action: answer_objection
    switch_output: 3
    subworkflow: "6.19 answer_objection"
    purpose: "Responde a una objecion del cliente (tipicamente 'lo voy a pensar') tratando de no dejar enfriar la conversacion."
  - action: offer_booking
    switch_output: 4
    subworkflow: "6.20 offer_booking"
    purpose: "Invita al cliente a agendar."
    note: "no se ve emitido por rules_evaluation en esta version; probablemente lo emite 5 llm_decision cuando rules_engine delega al LLM"
  - action: confirm_booking
    switch_output: 5
    subworkflow: "6.5 confirm_booking_executor"
    purpose: "Confirma la reserva de punta a punta: crea el evento en Google Calendar y la fila en DB."
  - action: schedule_followup
    switch_output: 6
    subworkflow: "6.21 schedule_followup"
    purpose: "Agenda un followup automatico a futuro (ej. 'el cliente dijo que avisa despues')."
  - action: handoff_human
    switch_output: 7
    subworkflow: "6.22 handoff_human"
    purpose: "Deriva la conversacion a una persona del equipo, creando el caso de handoff correspondiente."
  - action: offer_available_slots
    switch_output: 8
    subworkflow: "6.23 offer_available_slots"
    purpose: "Ofrece horarios disponibles (lista varios o revalida uno especifico)."
  - action: cancel_booking
    switch_output: 9
    subworkflow: "6.6 cancel_booking"
    purpose: "Cancela la reserva activa del lead."
  - action: reschedule_booking
    switch_output: 10
    subworkflow: "6.10 reschedule_booking"
    purpose: "Reprograma la reserva activa a un nuevo horario."
  - action: collect_address
    switch_output: 11
    subworkflow: "6.11 collect_address"
    purpose: "Pide la direccion exacta donde se hara el servicio."
  - action: confirm_address
    switch_output: 12
    subworkflow: "6.12 confirm_address"
    purpose: "Valida/confirma la direccion recibida antes de avanzar a horario."
  - action: send_pre_service_instructions
    switch_output: 13
    subworkflow: "6.13 send_pre_service_instruction"
    purpose: "Envia el checklist de instrucciones previas al servicio para una reserva ya confirmada."
    note: "no se ve emitido por rules_evaluation; probablemente disparado por un scheduler/followup, no por respuesta directa a mensaje del usuario"
  - action: notify_on_the_way
    switch_output: 14
    subworkflow: "6.14 notify_on_the_way"
    purpose: "Avisa que el staff esta en camino al servicio."
    note: "idem: no emitido por rules_evaluation, probablemente trigger externo (staff marca 'en camino')"
  - action: request_review
    switch_output: 15
    subworkflow: "6.15 request_review"
    purpose: "Pide una resena/calificacion despues del servicio."
  - action: request_referral
    switch_output: 16
    subworkflow: "6.16 request_referral"
    purpose: "Pide al cliente que refiera a alguien mas."
  - action: send_service_menu
    switch_output: 17
    subworkflow: "6.17 send_service_menu"
    purpose: "Envia el menu de servicios del negocio."
  - action: recommend_service
    switch_output: 18
    subworkflow: "6.18 recommend_service"
    purpose: "Recomienda un servicio especifico segun lo que cuenta el cliente del estado de su auto."
  - action: ask_payment_preference
    switch_output: 19
    subworkflow: "6.25 ask_payment_preference"
    purpose: "Pregunta como el cliente prefiere pagar (link Flow ahora vs al terminar)."
    note: "condicionalmente sigue a 6.26 payment_request cuando payment_preference=prepago"
  - action: check_payment_status
    switch_output: 20
    subworkflow: "6.28 check_payment_status"
    purpose: "Agregado 2026-07-24, a pedido del usuario. Cuando el cliente pregunta si ya se registro su pago ('ya pague', 'verifica mi pago', etc), consulta EN VIVO la API real de Flow.cl (payment/getStatusByFlowOrder) -- nunca responde solo con el payment_status guardado en la DB local. Si Flow dice que esta pagado pero la DB local todavia no lo refleja (self-heal), le pega a su propio webhook /webhook/flow-payment-confirmed (mismo que usa Flow.cl) para que 6.27 procese la confirmacion completa (mensaje + DB) antes de responder."

known_gaps:
  - issue: "[RESUELTO 2026-07-18] action 'answer_faq' (emitido por ruleMultiVehicleFaq, rule_multi_vehicle_faq) NO tenia entrada en el mapeo de action_router (solo tiene 0-19)."
    impact: "El Switch evaluaba ({...})[$json.decision.action] -> undefined -> ningun output matcheaba -> dead-end silencioso para ese caso."
    fix_applied: "En vez de agregar un output 21 al Switch, se cambio rule_multi_vehicle_faq para emitir action: 'answer_question' (linea ~5340 de rules_evaluation), igual que el resto de las reglas que responden FAQs (rule_business_faq_router, rule_coverage_question, etc.) -- consistente con el patron existente, sin tocar action_router."
    file_modified: "workflows/exports/uncategorized/3 - 3 rules_engine__id-e88adaaf-dfed-46af-8f5f-4dd73f2cb5c5.json"
  - issue: "action 'ignore' (ruleEmptyMessage) nunca llega a action_router: se corta antes, en rules_engine mismo."
    detail: "build_output calcula shouldStop = !shouldCallLlm && (!action || action==='ignore'); shouldCallActionExecutor excluye explicitamente 'ignore'. Ver routing_gates abajo."
  - issue: "[Detectado 2026-07-21, no arreglado -- bajo impacto] Respuesta fuera de guion durante 'service_change_requires_cancel_rebook' (el bot pregunto si confirmar cancelar+reagendar) puede caer al fallback LLM y responder send_pre_service_instructions en vez de re-preguntar la confirmacion."
    detail: "Ninguna regla de rules_engine cubre una respuesta que no sea afirmacion/cancelacion mientras intent_last==='service_change_requires_cancel_rebook' (ruleConfirmServiceChangeCancelAndRebook solo matchea isAffirmativeReply o looksLikeCancelConfirmationIntent). Ejemplo real: usuario repite el nombre del servicio ('El lavado premium') en vez de responder si/no -- cae al LLM, que interpreto la reserva como ya lista para preparacion y ofrecio instrucciones pre-servicio, ignorando el cambio de servicio pendiente de confirmar."
    impact: "Bajo -- el usuario puede simplemente responder con la confirmacion explicita despues (funciona, ver escenario QA 5693400002) y no se pierde ni corrompe ningun dato. No se justifico arreglarlo esta sesion; queda como candidato a una regla explicita de re-prompt si se repite en produccion."
  - issue: "[RESUELTO 2026-07-21] isAffirmativeReply() no toleraba puntuacion -- 'Si, dale' (con coma) no matcheaba ni el chequeo exacto (t==='dale') ni el chequeo de substring (t.includes('si dale'), roto por la coma en medio)."
    detail: "normalizeText() nunca quita puntuacion (solo minusculas + sin tildes + espacios colapsados), asi que isAffirmativeReply operaba sobre texto CON comas/puntos intactos. Una respuesta natural y muy comun en espanol casual como 'Si, dale' devolvia false, rompiendo silenciosamente CUALQUIER regla que dependa de esta funcion (rule_affirmative_after_price_list_ask_service, rule_ask_payment_preference, rule_quote_accepted_offer_slots, rule_confirm_service_change_cancel_and_rebook, etc.) cuando el usuario escribe con coma. Confirmado via QA (escenario 5693500003, paso 2) + audit_logs mostrando que cayo a rule_missing_required_fields (el catch-all generico) en vez de la regla especifica esperada."
    fix_applied: "isAffirmativeReply() ahora quita puntuacion comun (,.;!?) antes de hacer cualquier match, local a esta funcion (no toca normalizeText compartida por el resto del archivo). Validado con un test unitario aislado (extrayendo la funcion del jsCode real) antes de pushear, y con una regresion completa de las 18 escenarios/65 pasos existentes (0 fallos) despues de pushear -- cero regresiones."
    file_modified: "workflows/exports/uncategorized/3 - 3 rules_engine__id-e88adaaf-dfed-46af-8f5f-4dd73f2cb5c5.json"
  - issue: "[Detectado 2026-07-21, no arreglado -- bajo impacto, pre-existente] isAffirmativeReply() tiene un falso positivo: 'no me interesa, gracias' devuelve true porque el chequeo t.includes('me interesa') no distingue una negacion previa ('no me interesa' contiene 'me interesa' como substring)."
    detail: "Confirmado que este bug es INDEPENDIENTE del fix de puntuacion de arriba -- existia antes tambien (la substring 'me interesa' aparece igual con o sin comas alrededor). Arreglarlo bien requeriria revisar negaciones ('no', 'nunca', etc.) antes de CADA uno de los ~100 checks de substring de esta funcion, cambio mucho mas grande y riesgoso que el de puntuacion. No se toco esta sesion."
    impact: "Bajo -- requiere que el usuario diga literalmente 'no me interesa' en un contexto donde isAffirmativeReply se evalua, y aun asi el peor caso es que el bot trate una negacion como afirmacion (avanza el flujo en vez de detenerse), no pierde datos ni rompe nada irreversible."
  - issue: "[Descubierto 2026-07-24, no es un bug -- es documentacion de arquitectura] Agregar una accion NUEVA al sistema (ej. check_payment_status) requiere actualizar CUATRO listas hardcodeadas separadas, en 3 workflows distintos, o el pipeline revienta con errores confusos que no apuntan claramente al problema real."
    detail: |
      Las 4 listas (todas deben incluir el nombre exacto de la accion nueva):
      1. `3 rules_engine` / nodo `build_output` / array `actionsThatBuildMessageInExecutor`
         -- si la accion nueva arma su mensaje dinamicamente (no de antemano en la
         regla), tiene que estar aca o revienta con "requires message but message is
         empty" apenas la regla la devuelve.
      2. `3 rules_engine` / nodo `build_rule_decision_payload` / el MISMO array
         duplicado en un segundo nodo -- exactamente el mismo chequeo, codigo
         copy-pasteado, hay que actualizar los dos.
      3. `6 action_executor` / nodo `validate_action` / array `globalAllowedActions`
         -- si la accion no esta aca, ese nodo devuelve `{error: true, errors, original}`
         como item de salida, y como `error` es una key reservada en n8n para items de
         Code node, el n8n_ENGINE MISMO revienta con "Invalid output format" / "output
         item contains the reserved key error" -- un error totalmente opaco que no
         menciona la accion nueva ni la lista real culpable.
      4. `4 context_builder` / nodo `build_context_packet` / array `SUPPORTED_ACTIONS`
         -- cuando la regla ya devolvio una action especifica (`ruleAction` truthy),
         `buildAllowedActions()` simplemente hace
         `SUPPORTED_ACTIONS.includes(ruleAction) ? [ruleAction] : []` -- si no esta,
         `context_packet.allowed_actions` queda vacio y `validate_action` (punto 3)
         tira "Missing or empty context_packet.allowed_actions" / "Action not allowed
         in current state".
      Ademas, hay una QUINTA lista (`build_action_requirements` en action_executor,
      mapa `requiredByAction`) que NO revienta si falta la entrada (usa `|| []` como
      fallback silencioso) -- opcional agregarla por prolijidad, no bloqueante.
    fix_applied: "Se agregaron los 4 registros necesarios para 'check_payment_status'. Se documenta aca para que la proxima vez que se agregue una accion nueva, se sepa de entrada que hay que tocar estos 4 lugares en vez de descubrirlo error por error."
    files_modified:
      - "workflows/exports/uncategorized/3 - 3 rules_engine__id-e88adaaf-dfed-46af-8f5f-4dd73f2cb5c5.json (build_output + build_rule_decision_payload)"
      - "workflows/exports/uncategorized/6 - 6 action_executor__id-80e7685e-2690-4d1e-a5e7-5ccb7d0e8a13.json (validate_action)"
      - "workflows/exports/uncategorized/4 - 4 context_builder__id-5f5ef274-4b7a-4a1a-b463-ff22e5eae55e.json (build_context_packet)"
  - issue: "[RESUELTO 2026-07-21] rule_multi_vehicle_faq (priority 85) estaba DESPUES de rule_unknown_faq (priority 75) en el array literal de evaluacion, al reves de lo que indica su priority declarada."
    detail: "rule_unknown_faq matchea CUALQUIER pregunta no relacionada a booking en stage new_lead (basta un '?' al final o unas pocas palabras de pregunta) -- mucho mas amplio que rule_multi_vehicle_faq. Como el array es first-match-wins y unknown_faq estaba primero, una pregunta como '\''Pueden lavar dos autos al mismo tiempo?'\'' caia siempre en unknown_faq (mensaje generico 'habla con nuestro equipo') y rule_multi_vehicle_faq quedaba efectivamente inalcanzable para su fraseo mas natural (una pregunta). Confirmado via QA (escenario 5693500001, paso 2) + audit_logs mostrando rule_name: rule_unknown_faq para ese texto exacto."
    fix_applied: "Se reordeno el array literal `const rules = [...]` en rules_evaluation para que ruleMultiVehicleFaq quede ANTES de ruleUnknownFAQ (sin tocar la logica interna de ninguna de las dos funciones). Re-verificado: la misma pregunta ahora dispara rule_multi_vehicle_faq correctamente."
    file_modified: "workflows/exports/uncategorized/3 - 3 rules_engine__id-e88adaaf-dfed-46af-8f5f-4dd73f2cb5c5.json"

routing_gates:
  source: "Code node build_output, dentro de rules_engine, evaluado despues de rules_evaluation"
  should_call_llm: "ruleResult.should_call_llm === true (solo ruleDefaultContinue lo pone en true; es el catch-all cuando ninguna regla matchea)"
  should_call_action_executor: "should_call_llm === false AND ruleResult.action existe AND ruleResult.action !== 'ignore'"
  should_stop: "should_call_llm === false AND (no hay action O action === 'ignore')  -> conversacion no genera respuesta (ej: mensaje vacio)"
  actions_that_build_message_in_executor:
    description: "Estas acciones NO requieren que rules_evaluation arme el texto final (ruleResult.message puede ir vacio); el mensaje se construye dentro del sub-workflow 6.x correspondiente. Para el resto, si should_call_action_executor=true y no hay message, build_output tira error."
    values: [send_quote, offer_available_slots, confirm_booking, cancel_booking, reschedule_booking, confirm_address, send_service_menu, recommend_service, ask_payment_preference]

# ---------------------------------------------------------------------------
# CADENA DE REGLAS (orden real de evaluacion; primer match gana; sale del array
# literal `const rules = [...]` en rules_evaluation, lineas 5556-5647 del jsCode)
# ---------------------------------------------------------------------------
# Cada item = una funcion rule*(ctx). Una funcion puede tener varias "branches"
# (sub-casos internos, cada uno con su propio buildRuleResult). El orden entre
# funciones es el de evaluacion; el orden entre branches de una misma funcion
# es el orden en que aparecen sus `if` dentro del cuerpo (primer if que matchea).
rule_chain:
  - fn: ruleHumanHandoffLocked
    priority: 100
    branches:
      - { rule_key: rule_human_handoff_locked, action: answer_question, trigger: "lead_state.human_handoff === true (stage human_handoff)" }
    note: "Maxima prioridad: si el lead esta marcado para atencion humana, NINGUNA otra regla se evalua."
    note2: "[Verificado 2026-07-21 via audit_logs real] La action final que llega al bot NO es 'answer_question': action_executor tiene un guard (reason 'action_executor_guard_handoff_lock') que fuerza action='handoff_human' cuando el lead esta en handoff_lock, sin importar lo que devuelva la regla. El campo action de esta regla en rules_evaluation.js es efectivamente informativo/no-terminal para este caso -- para saber el comportamiento real hay que revisar tambien action_executor, no solo rules_engine. Ver escenario QA 5693400008."

  - fn: ruleExplicitHumanRequest
    priority: 95
    branches:
      - { rule_key: rule_explicit_human_request, action: handoff_human, trigger: "user_requested_human (texto pide hablar con una persona)" }

  - fn: ruleIsBot
    priority: 95
    branches:
      - { rule_key: rule_is_bot_disclosure, action: ask_missing_data, trigger: "user_asking_if_bot (pregunta si es un bot/humano)" }
    note: "action=ask_missing_data aqui es enganoso: el message es fijo (disclosure), no pide un campo especifico."

  - fn: ruleComplaintHandoff
    priority: 99
    branches:
      - { rule_key: rule_customer_complaint_handoff, action: answer_question, trigger: "customer_complaint_requires_human_handoff", state_update: { stage: human_handoff, last_bot_action: handoff_human, human_handoff: true } }
    note: "action=answer_question pero el efecto real es handoff (state_update fuerza stage=human_handoff y human_handoff=true)."

  - fn: ruleEmptyMessage
    priority: 90
    branches:
      - { rule_key: rule_empty_message, action: ignore, trigger: "mensaje vacio y sin attachments" }
    note: "unico camino que produce should_stop=true (no llega a action_executor)."

  - fn: ruleShowMeSlotsAfterQuote
    priority: 91
    branches:
      - { rule_key: rule_show_me_slots_after_quote, action: offer_available_slots, trigger: "user_asks_to_see_slots_after_quote", stage_out: booking_selection }

  - fn: ruleConfirmServiceChangeCancelAndRebook
    priority: 90
    branches:
      - { rule_key: rule_confirm_service_change_cancel_and_rebook, action: cancel_booking, trigger: "user_confirmed_service_change_cancel_and_rebook", stage_out: cancelling }
    note: "va antes que ruleCancelBooking a proposito: el usuario puede confirmar diciendo literalmente 'cancela' dentro de un flujo de cambio de servicio."

  - fn: ruleVehicleRuralClarificationReplyProvided
    priority: 95
    branches:
      - { rule_key: rule_vehicle_rural_clarification_resolved, action: ask_missing_data, trigger: "vehicle_rural_clarification_resolved" }

  - fn: ruleStaffSelectionReplyProvided
    priority: 95
    branches:
      - { rule_key: rule_staff_selection_reply_not_recognized, action: answer_question, trigger: "respuesta a 'con quien prefieres' no reconocida", stage_out: booking_selection }
      - { rule_key: rule_staff_selected_ready_for_slots, action: offer_available_slots, trigger: "staff_selected_ready_for_slots", stage_out: booking_selection }
    note: "solo aplica si el negocio tiene staff_selection_mode=ask_customer y mas de un staff activo. [Verificado 2026-07-21 contra DB real] Para Ahumada Detailing HOY: agent_business_config.config.staff_selection_mode es NULL y la tabla agent_staff tiene 0 filas -- esta regla es codigo INALCANZABLE en produccion actualmente. No se le genero QA por esto (probaria una rama muerta); reconsiderar si el negocio llega a configurar mas de un staff."

  - fn: ruleCancelTargetSelected
    priority: 95
