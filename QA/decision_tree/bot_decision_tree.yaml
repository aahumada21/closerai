  - fn: ruleCancelBooking
    priority: 94
    branches:
      - { rule_key: rule_cancel_booking, action: cancel_booking, trigger: "user_requested_cancellation", stage_out: cancelling, note: "0 o 1 cita activa -- comportamiento sin cambios" }
      - { rule_key: rule_cancel_booking_with_target, action: cancel_booking, trigger: "user_requested_cancellation_with_target", stage_out: cancelling, note: "2+ citas activas Y el mismo mensaje ya especifica cual (numero/ordinal), ej. 'cancela la 2'" }
      - { rule_key: rule_cancel_booking_needs_target, action: answer_question, trigger: "user_requested_cancellation_needs_target", note: "2+ citas activas SIN especificar cual -- lista todas y pregunta, deja intent_last=cancel_target_selection_pending para que ruleCancelTargetSelected atrape la respuesta" }
    known_gaps:
      - issue: "[RESUELTO 2026-07-25] Bug real reportado por el usuario: con 2 reservas activas, pidio 'cancelar la 2' y se cancelo la 1 en su lugar -- rule_cancel_booking no tenia forma de apuntar a una reserva especifica, siempre cancelaba 'la' reserva que encontrara 6.6/check_appointment (LIMIT 1, la mas proxima). Nunca preguntaba cual, y tampoco entendia una referencia numerica aunque el cliente la diera."
        fix_applied: "Nuevo campo state_update.target_appointment_id, threaded desde la regla -> action_executor/cancel_booking -> 6.6/normalize_cancel_booking_input -> 6.6/DB_Check_Active_Appointment_For_Cancel (query ahora acepta un 2do parametro opcional: si viene, filtra por ese id especifico; si no, mismo comportamiento LIMIT-1-mas-proxima de siempre, sin romper el caso de 1 sola reserva). Cuando hay 2+ activas y el mensaje no especifica cual, se lista y se pregunta (rule_cancel_booking_needs_target); la respuesta se resuelve via ruleCancelTargetSelected."
      - issue: "[RESUELTO 2026-07-25, mismo dia] El fix de arriba no funciono en la primera prueba real: se cancelo OTRA reserva distinta a la pedida (el evento SI se borro de Google Calendar -- confirmado {success:true} -- pero era el evento equivocado). Causa: action_executor/cancel_booking buscaba target_appointment_id en incomingStateUpdate.target_appointment_id (=\$json.state_update, una copia 'saneada' que NO conserva campos custom) y en \$json.execution_context.target_appointment_id (que tampoco existe ahi) -- el valor real solo vivia en \$json.decision.state_update.target_appointment_id y \$json.execution_context.state_update.target_appointment_id (un nivel mas anidado de lo que se chequeaba)."
        fix_applied: "cancel_booking ahora chequea decision.state_update.target_appointment_id y execution_context.state_update.target_appointment_id PRIMERO (las fuentes reales, confirmadas leyendo la ejecucion real en n8n), antes de los paths originales (que se dejan como fallback por si acaso)."

