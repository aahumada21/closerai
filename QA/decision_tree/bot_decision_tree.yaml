    known_gaps:
      - issue: "[RESUELTO 2026-07-25] El usuario pidio explicitamente (tras encontrar el bug de 'otro auto'): si tiene 2 reservas activas, 'para cuando tengo reserva?' deberia listar las 2, no solo una. La causa de fondo era doble: (1) esta regla leia lead_state.booking_date/booking_time (un solo valor) en vez de la tabla appointments; (2) 2 lead_loader/db_load_active_appointment traia solo 1 fila (LIMIT 1), asi que aunque se arreglara la regla no habia de donde sacar la segunda cita."
        fix_applied: "2 lead_loader: query cambiada a LIMIT 5 (antes LIMIT 1), code_build_output ahora expone memory.active_appointments (array, ademas de memory.last_appointment que se mantiene igual para las demas reglas que ya lo usaban). Esta regla ahora itera memory.active_appointments completo: si hay 1 sola, mismo mensaje de siempre; si hay 2+, las lista numeradas con fecha/hora real de cada una."
      - issue: "[RESUELTO 2026-07-25, mismo dia] userAsksAboutExistingAppointment seguia sin reconocer variantes reales: 'que hora TENGA agendada?' (subjuntivo/typo en vez de 'tengo') no calzaba con ninguna frase exacta de la lista -- cayo en rule_availability_request (ofrecio horarios de agendar en vez de responder sobre la reserva)."
        fix_applied: "Ademas de la lista de frases exactas (se mantiene), se agrego un chequeo combinatorio: palabra de posesion (tengo/tenga, EXCLUYENDO 'tengo que' para no confundir con intencion de agendar) + sustantivo de reserva (hora/cita/reserva/agendad/turno) en cualquier orden. Probado contra 13 casos incluyendo los que deberian seguir dando falso (ej. 'tengo que agendar una hora', 'a que hora tienen abierto') -- todos correctos, sin falsos positivos detectados."
      - issue: "[RESUELTO 2026-07-26] 'cuales son mis reservas?' / 'mis reservas?' seguian sin calzar -- usan el posesivo 'mi/mis' en vez del verbo 'tengo/tenga', que era la unica palabra de posesion reconocida hasta ahora. Cayo en el LLM, que dio una respuesta confusa mezclando la reserva real con una seleccion de horario en curso."
        fix_applied: "hasPossessionWord ahora tambien matchea /\\bmis?\\b/ (mi/mi como palabra completa, con limites de palabra para no matchear dentro de 'administrar') y /\\bcuales? son\\b/. Prueba de regresion con 21 casos (incluyendo 'administrar mi negocio', 'cancela mi reserva' -- este ultimo sigue yendo a ruleCancelBooking igual, que esta antes en el array) -- todos correctos."

