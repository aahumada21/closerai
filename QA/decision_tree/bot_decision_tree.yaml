    branches:
      - { rule_key: rule_send_price_list_when_vehicle_and_district_ready, priority: 92, action: send_quote, trigger: "vehicle_and_district_received_for_price_list", stage_out: qualified }
      - { rule_key: "(fallback missing fields)", priority: "priceIntent ? 91 : 80", action: ask_missing_data, trigger: "campo requerido faltante para el stage actual (getRequiredFields(stage)); prioridad mas alta si ademas hay intent de precio" }
    note: "ultima red antes de rule_default_continue; cubre el caso generico 'falta un dato obligatorio del stage'."

  - fn: ruleDefaultContinue
    priority: 0
    branches:
      - { rule_key: rule_default_continue, action: null, resolution_type: send_to_llm, trigger: "ninguna regla anterior matcheo -> se delega la interpretacion a 5 llm_decision" }
    note: "catch-all final. El LLM puede resolver a acciones que rules_engine no emite directamente, ej. offer_booking (ver known_gaps/actions notas)."
