    requires_stage_in: [booked]
    known_gaps:
      - issue: "[RESUELTO 2026-07-25] Bug real reportado por el usuario en su conversacion propia real: pidio agendar un 2do lavado para 'mi otro auto', el bot pidio corregir el tipo de vehiculo (SUV -> hatchback), el usuario confirmo con 'Si' -- y ESTA regla intercepto ese 'si' (matchea confirmSignals) como si fuera un acknowledgment de una reserva YA EXISTENTE, respondiendo 'Tu reserva ya quedo confirmada' cuando en realidad NUNCA se creo ninguna reserva para el segundo auto (no se ofrecieron horarios, no se guardo direccion, nada). Confirmado via audit_logs + tabla appointments (0 filas nuevas creadas) -- la regla literalmente le mintio al cliente."
        fix_applied: "[AMPLIADO 2026-07-25, mismo dia] El guard inicial (solo intent_last==='vehicle_type_correction') resulto insuficiente -- el usuario reprodujo el MISMO bug por otro camino: pidio agendar el 2do auto, corrigio el vehiculo, y al llegar a 'Quieres que te mande los horarios para agendar?' (rule_send_quote_when_commercial_context_complete, que deja stage='quoted' y last_bot_action='send_quote_in_progress') respondio 'si' -- de nuevo interceptado con 'confirmado' falso. Guard reemplazado por uno general isMidNewQuoteFlow: bloquea si stage==='quoted' O last_bot_action es send_quote/send_quote_in_progress O intent_last es vehicle_type_correction/quote_ready -- el mismo criterio 'isAfterQuote' que ya usa ruleShowMeSlotsAfterQuote, asi el 'si' cae correctamente en esa regla (o mas abajo en la cadena) en vez de en el acknowledgment de reserva vieja."
        related_fix: "De paso se cambio la fuente de la fecha mostrada: antes usaba lead_state.booking_date/booking_time (un solo valor, se detecto corrupto -- una decision del LLM en un turno no relacionado le habia inyectado booking_time='02:00' sin ninguna cita real a esa hora). Ahora usa memory.last_appointment.start_at (dato real de la tabla appointments) con fallback a los campos de lead_state solo si no hay cita real cargada."

