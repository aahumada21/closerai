  - workflow: "6.18 recommend_service"
    file: "workflows/exports/uncategorized/6.18 - 6.18 recommend_service__id-dd796016-14dd-4845-8d96-84722bcf7bc5.json"
    purpose: "Recomienda un servicio especifico (basico/profundo/premium) clasificando por palabras clave el ultimo mensaje del usuario (que tan sucio esta el auto, si pide algo economico, etc.), pidiendo vehiculo+comuna primero si faltan."
    branch_points:
      - node: "normalize_recommend_service_input (guard)"
        type: code_branch
        condition: "!leadId o !channel"
        outcomes:
          - "falta lead_id: throw Error('Missing lead_id in recommend_service')"
          - "falta channel: throw Error('Missing channel in recommend_service')"
      - node: "build_recommend_service_result"
        type: code_branch
        condition: "missingFields.length > 0 (vehicle_type y/o district desconocidos)"
        outcomes:
          - "faltan datos: pide vehiculo+comuna antes de recomendar, stage='service_discovery'; salta la inferencia de servicio"
          - "ambos conocidos: sigue a inferRecommendedService (clasificador de keywords)"
      - node: "build_recommend_service_result / inferRecommendedService (3 vias + default, primer match gana)"
        type: code_branch
        condition: "latest_user_message normalizado matcheado contra listas premiumSignals / deepSignals / basicSignals, en ese orden"
        outcomes:
          - "premiumSignals ('premium','completo','muy sucio','manchas','olor',...) -> recomienda lavado_premium"
          - "deepSignals ('profundo','bien limpio','sucio','interior','aspirado',...) -> recomienda lavado_profundo"
          - "basicSignals ('barato','economico','rapido','simple','basico',...) -> recomienda lavado_esencial"
          - "ningun signal matchea -> fallback por defecto recomienda lavado_profundo"
        note: "cada outcome produce un mensaje distinto con su razon canned; stage='qualified', next_goal='quote_or_offer_slots'."

  - workflow: "6.19 answer_objection"
    file: "workflows/exports/uncategorized/6.19 - 6.19 answer_objection__id-1823781d-ffb8-4c74-8729-6877a3cdc83e.json"
    purpose: "Responde a una objecion del cliente -- tipicamente 'lo voy a pensar' -- reforzando el mensaje del LLM con un template mas robusto si le falta el cierre esperado (ofrecer horarios/agendar), para no dejar la conversacion enfriarse."
    branch_points:
      - node: "answer_objection"
        type: code_branch
        condition: "isWillThink: latest_user_message normalizado contiene 'lo voy a pensar' / 'lo pensare' / 'lo pensar' / 'despues veo' / 'despues te aviso' / 'lo veo'"
        outcomes:
          - "isWillThink=true Y (messageToSend vacio O no tiene los cierres esperados) -> pisa con template robusto (strongWillThink: ofrece enviar horarios/agendar)"
          - "isWillThink=true Y el mensaje del LLM ya tiene los cierres esperados (contiene 'perfecto'+'cualquier cosa'+'te puedo ayudar'/'te ayudo'+'horario(s)') -> mantiene el mensaje del LLM tal cual"
          - "isWillThink=false Y messageToSend vacio -> usa genericFallback"
          - "isWillThink=false Y messageToSend presente -> mantiene el mensaje del LLM tal cual"
    note: "Siempre stage='closing', next_goal='book_appointment' sin importar la rama."

  - workflow: "6.20 offer_booking"
    file: "workflows/exports/uncategorized/6.20 - 6.20 offer_booking__id-1b5873b4-fe9b-4a9e-b207-1ee23790b51c.json"
    purpose: "Envia el mensaje (armado aguas arriba, tipicamente por el LLM) que invita al cliente a agendar. Solo se emite desde 5 llm_decision -- ninguna regla de rules_engine la dispara directamente."
    branch_points: []
    note: "Pass-through lineal puro (normalize_input -> offer_booking). Ningun condicional afecta mensaje/estado; siempre stage=closing, next_goal=book_appointment, message=execution_context.message tal cual."

  - workflow: "6.21 schedule_followup"
    file: "workflows/exports/uncategorized/6.21 - 6.21 schedule_followup__id-9a8541cd-8c27-4aa1-9d93-4a2a290bfe74.json"
    purpose: "Agenda un followup automatico a futuro (ej. 'el cliente dijo que despues avisa') para que 7 followup_scheduler lo retome mas adelante."
    branch_points: []
    note: "Lineal; solo cadenas de fallback || para message/followup_type/scheduled_for por defecto (seleccion de valor default, no rutas distintas)."

  - workflow: "6.22 handoff_human"
    file: "workflows/exports/uncategorized/6.22 - 6.22 handoff_human__id-0520cc38-8cfa-4188-a91a-b2ec332fed9c.json"
    purpose: "Deriva la conversacion a un humano: si ya estaba en handoff, solo recuerda que sigue derivada; si no, crea el caso via 8.0 human_handof y avisa al cliente que un humano va a seguir."
    branch_points:
      - node: "handoff_human"
        type: code_branch
        condition: "alreadyInHandoff (state.human_handoff===true O $json.handoff===true O meta.handoff.human_handoff===true O last_bot_action==='human_handoff_already_active')"
        outcomes:
          - "handoff_locked=true: mensaje 'Tu reclamo ya esta derivado al equipo...'; db_operations=[messages,lead_state]; next_goal='wait_human_response'"
          - "handoff_locked=false: mensaje de derivacion (custom o generico); db_operations incluye handoff_cases; crea handoff_case nuevo; next_goal='human_takeover'"
      - node: "IF handoff_locked"
        type: if
        condition: "$json.handoff_locked === true"
        outcomes:
          - "true -> nota 'handoff_lock_active'"
          - "false -> nota 'handoff_case_created' (via 8.0 human_handoff)"
      - node: "normalize_handoff_result"
        type: code_branch
        condition: "handoffLocked (espeja la rama anterior tras el retorno de 8.0)"
        outcomes:
          - "locked: db_operations solo [messages, lead_state]"
          - "no locked: db_operations agrega 'handoff_cases'"

  - workflow: "6.23 offer_available_slots"
    file: "workflows/exports/uncategorized/6.23 - 6.23 offer_available_slots__id-135d7590-2dab-4032-a3c8-ba36a0ef33d7.json"
    purpose: "Punto central para ofrecer horarios al cliente: lista varias opciones (via 6.4) o revalida una especifica (via 6.2), agregando una nota sobre el metodo de pago cuando corresponde."
    branch_points:
      - node: "offer_available_slots"
        type: code_branch
        condition: "isSpecificSlotCheck: next_goal==='check_specific_slot_availability' O (booking_date && booking_time presentes Y availability_confirmed !== true)"
        outcomes:
          - "true: check_type='specific_slot'; next_goal='check_specific_slot_availability'"
          - "false: check_type='list_slots'; next_goal='show_available_slots'"
      - node: "offer_available_slots (getAvailabilityConfig, switch)"
        type: code_branch
        condition: "valor de availability_window"
        outcomes:
          - "this_week -> 7 dias, offset 0, max 3 slots"
          - "next_week -> 7 dias, offset 7, max 5 slots"
          - "next_14_days -> 14 dias, offset 0, max 6 slots"
          - "next_30_days -> 30 dias, offset 0, max 8 slots"
          - "default -> igual que this_week"
      - node: "IF specific_slot_requested"
        type: if
        condition: "availability_request.check_type === 'specific_slot'"
        outcomes:
          - "true -> llama a '6.2 check_calendar_slot' -> build_specific_slot_result"
          - "false -> build_available_slots_message (lista varios horarios)"
      - node: "build_available_slots_message"
        type: code_branch
        condition: "slots.length === 0"
        outcomes:
          - "true: 'Por ahora no encontre horarios disponibles...'; next_goal='manual_availability_review'; booking_options=[]"
          - "false: lista numerada, next_goal='collect_selected_slot'"
      - node: "build_available_slots_message (prefijo de nota de pago)"
        type: code_branch
        condition: "payment_preference === 'prepago' | 'postpago' | otro"
        outcomes:
          - "prepago -> antepone 'Perfecto! Al confirmar tu turno te mando el link de pago por Flow.'"
          - "postpago -> antepone 'Perfecto! Queda anotado pago al terminar (efectivo o transferencia).'"
          - "ninguno -> sin prefijo"
      - node: "build_available_slots_message (wasSpecificSlotUnavailable)"
        type: code_branch
        condition: "$json.unavailable_specific_slot === true O intent_last === 'manual_slot_unavailable'"
        outcomes:
          - "true -> intro 'Ese horario no aparece disponible. Tengo estas opciones cercanas...'"
          - "false -> intro '{notaPrepago}Tengo estos horarios disponibles...'"
      - node: "IF specific_slot_available"
        type: if
        condition: "state_update.availability_confirmed === true"
        outcomes:
          - "true -> finalize_specific_slot_available_result (pass-through)"
          - "false -> fin implicito de esa rama (sin nodo conectado en este export)"
      - node: "build_specific_slot_result"
        type: code_branch
