    purpose: "Paso final comun a (casi) toda accion ejecutada: aplica los defaults de estado (stage/next_goal/last_bot_action) segun que accion corrio, y persiste el resultado para auditoria. Caso especial para send_quote: marca la cotizacion como enviada o fallida segun si el mensaje realmente salio."
