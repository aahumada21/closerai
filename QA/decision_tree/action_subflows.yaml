          - "true (no es send_quote) -> pasa los datos sin cambios"
          - "false (es send_quote) -> sigue a la rama anidada sobre el estado de entrega"
      - node: "finalize_send_quote_state (anidado, solo si action==send_quote)"
        type: code_branch
        condition: "ok: message_sent===true O success===true O status en ('sent','accepted') O provider_status en ('sent','accepted') O provider_message_id presente"
        outcomes:
          - "ok=true: stage='quoted', last_bot_action='send_quote', next_goal='book_appointment'"
          - "ok=false: stage sin cambios, last_bot_action='send_quote_failed', next_goal='retry_quote'"
      - node: "is_send_quote_with_quote"
        type: if
        condition: "action==='send_quote' && quote_was_created===true && !!quote_db_id"
        outcomes:
          - "true -> corre update_quote_status (Postgres)"
          - "false -> salta directo a finalize_send_quote_state"
      - node: "IF_quote_message_sent"
        type: if
        condition: "message_sent===true O success===true O status/provider_status en ('sent','accepted') O provider_message_id presente"
        outcomes:
          - "true -> DB_Create_Quote_Followups (agenda un followup)"
          - "false -> se omite"
      - node: "normalize_final_state_update (tabla de 16 acciones)"
        type: code_branch
        condition: "action -> lookup en defaultsByAction"
        outcomes:
          - "cada una de las 16 acciones soportadas aplica un default distinto de stage/next_goal/last_bot_action/missing_fields (usado como base, sobreescrito por campos explicitos ya presentes)"
          - "accion no reconocida -> no se aplican defaults, solo sobreviven los campos explicitos ya saneados"

