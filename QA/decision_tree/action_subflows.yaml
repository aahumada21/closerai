  - workflow: "6 action_executor / confirm_booking (rama prepago_required)"
    file: "workflows/exports/uncategorized/6 - 6 action_executor__id-80e7685e-2690-4d1e-a5e7-5ccb7d0e8a13.json"
    purpose: "[CAMBIADO 2026-07-24] Reserva real del cupo (evento GCal + fila appointments status='pending_payment') al momento de confirmar una reserva prepago_required, ANTES de mandar el link de pago. Antes de este cambio, el sistema no creaba ni el evento de calendario ni la fila en appointments hasta que Flow confirmaba el pago -- mientras el cliente tenia el link abierto, el horario seguia apareciendo disponible para cualquier otro cliente (6.2 check_calendar_slot consulta Google Calendar directamente, no la tabla appointments). Ver QA/GUide/FLOW_PAYMENT_SYSTEM_EVALUATION_2026-07-24.md, punto 1."
    branch_points:
      - node: "IF prepago_slot_available (nuevo)"
        type: if
        condition: "resultado de 'Call 6.2 check_calendar_slot (hold)' -- misma verificacion en vivo contra Google Calendar que usa el flujo normal de 6.5"
        outcomes:
          - "true -> Call 6.3 create_calendar_booking (hold) -> build_pending_payment_appointment_payload -> insert_pending_payment_appointment (status='pending_payment') -> restore_context_for_payment_request -> 6.26 payment_request (sin cambios en el resto del flujo)"
          - "false (alguien tomo el horario justo antes) -> build_prepago_slot_taken_result: avisa que el horario ya no esta disponible, ofrece mostrar otros horarios (stage='booking_selection')"
    note: "El hold no tiene TTL propio en este nodo -- lo libera 6.29 release_expired_payment_holds (cron cada 10 min, holds >30 min sin pagar). El calendar_id para el delete en 6.29 esta hardcodeado a 'primary' porque appointments no tiene columna calendar_id y el sistema hoy solo usa un calendario por agente."
    known_gaps:
      - issue: "[RESUELTO 2026-07-25] confirm_booking resolvia payment_mode con esta prioridad: ctx.payment_mode -> context_packet.state.payment_mode (=lead_state.payment_mode, UN VALOR PEGADO de una reserva anterior de ESE lead) -> recien al final agent_business_config.config.payment_mode (el ajuste ACTUAL del negocio). Bug real: un lead que ya habia reservado una vez con prepago_only quedaba atascado usando prepago_only para SIEMPRE en reservas futuras, aunque el usuario cambiara el config global a prepago_required para probar -- confirmado via ejecucion real (394565): confirm_booking calculo isPrepagoreRequired=false (deberia haber sido true) porque leyo lead_state.payment_mode='prepago_only' en vez del config activo."
        fix_applied: "Prioridad invertida: agent_business_config.config.payment_mode (el ajuste de negocio ACTUAL) se chequea PRIMERO; ctx.payment_mode/lead_state.payment_mode quedan solo como fallback si el config no tiene valor (no deberia pasar en la practica). payment_mode es una decision de negocio que aplica a TODAS las reservas nuevas, no algo que deba quedar fijo por lead."

  - workflow: "6.29 release_expired_payment_holds"
    file: "(workflow nuevo, sin export local todavia -- creado directo via API, id j4DjI0eQ0eOYpAnJ)"
    purpose: "[NUEVO 2026-07-24] Cron cada 10 minutos, con DOS ramas paralelas desde el mismo Schedule Trigger. Rama 1: libera holds de cupo (prepago_required) cuyo pago nunca se confirmo dentro de 30 minutos. Rama 2 [agregada 2026-07-24]: le recuerda al cliente que le quedan pocos minutos ANTES de que el hold expire."
    branch_points:
      - node: "find_expired_holds (rama 1)"
        type: sql_filter
        condition: "appointments.status='pending_payment' AND created_at < NOW() - INTERVAL '30 minutes'"
        outcomes:
          - "0 filas (caso normal) -> no hace nada, termina la ejecucion sin efectos"
          - ">=1 fila -> borra el evento de Google Calendar (onError=continueRegularOutput + 3 reintentos, para que un evento ya borrado a mano no frene el resto del batch), marca appointments 'cancelled' (cancel_reason='payment_hold_expired'), limpia los campos de reserva/pago en lead_state, avisa al cliente"
      - node: "find_holds_needing_reminder (rama 2, nueva)"
        type: sql_filter
        condition: "appointments.status='pending_payment' AND payment_hold_reminder_sent_at IS NULL AND created_at entre 15 y 25 minutos de antiguedad (ventana de 10 min, igual al intervalo del cron, para garantizar que ningun hold se salte el aviso entre corridas)"
        outcomes:
          - "0 filas -> no hace nada"
          - ">=1 fila -> mark_reminder_sent (UPDATE payment_hold_reminder_sent_at=NOW(), ANTES de armar/enviar el mensaje, para garantizar como maximo un recordatorio por hold aunque el envio falle y se reintente) -> arma mensaje con el link de pago reenviado -> Call 6.1 send_hold_reminder -> log en messages"
    note: "Decisiones de negocio confirmadas con el usuario 2026-07-24: TTL=30 min, SI avisar al cliente cuando el hold expira, y SI mandar un recordatorio a mitad de camino (~15-20 min) antes de esa expiracion -- se decidio NO construir el recordatorio equivalente para el pending general de 7 dias (6.30), solo para este hold corto donde hay un horario real en juego. Requiere columna nueva `appointments.payment_hold_reminder_sent_at` (migracion additive, nullable, aplicada 2026-07-24)."

  - workflow: "6.30 reconcile_pending_payments"
    file: "(workflow nuevo, sin export local todavia -- creado directo via API, id nRnyi0HdNMaYFFeC)"
    purpose: "[NUEVO 2026-07-24] Cron cada 2 horas. Cierra el gap de 'la unica forma de detectar un pago perdido es que el cliente pregunte' -- recorre proactivamente lead_state.flow_order_id en estado pending y consulta la API real de Flow (payment/getStatusByFlowOrder), sin depender de que el cliente escriba. Encontrado con datos reales: 27 leads pending desde el 10-14 de julio, nunca resueltos porque nadie pregunto. Ver QA/GUide/FLOW_PAYMENT_SYSTEM_EVALUATION_2026-07-24.md, punto 2."
    branch_points:
      - node: "find_pending_payments"
        type: sql_filter
        condition: "lead_state.flow_order_id no vacio AND payment_status='pending', con edad calculada via el timestamp del ULTIMO mensaje saliente que contiene 'Monto: $' (no hay columna dedicada para cuando se genero la orden; lead_state.updated_at no sirve porque cualquier interaccion posterior no relacionada al pago lo pisa)"
        outcomes: ["query validada contra datos reales 2026-07-24: detecta correctamente los ~26 leads pending existentes con su edad real en dias"]
      - node: "IF payment_link_expired"
        type: if
        condition: "age_days >= 7 (decision de negocio confirmada con el usuario 2026-07-24)"
        outcomes:
          - "true -> mark_payment_expired (UPDATE payment_status='expired', sin llamar a Flow ni avisar al cliente -- se asume abandonado)"
          - "false -> build_reconcile_signature -> HTTP GET flow getStatusByFlowOrder (mismo HMAC y onError=continueRegularOutput que 6.28) -> IF flow_says_paid"
      - node: "IF flow_says_paid"
        type: if
        condition: "status===2 (pagado)"
        outcomes:
          - "true -> POST al propio webhook /webhook/flow-payment-confirmed (mismo mecanismo de self-heal que ya usa 6.28, reutiliza toda la logica probada de 6.27 incluyendo idempotencia)"
          - "false -> no hace nada, se re-evalua en la proxima corrida"
    note: "Decision de negocio confirmada con el usuario 2026-07-24: cada 2 horas, expira despues de 7 dias sin avisar al cliente (se asume abandonado). Multiples leads por corrida se procesan de forma independiente via $(\"find_pending_payments\").item.json (no .first(), a diferencia de nodos equivalentes en action_executor/6.27 que procesan un solo lead por ejecucion)."
    extra_branch_points:
      - node: "IF stuck_alert_needed [agregado 2026-07-24]"
        type: if
        condition: "age_days >= 1 (24h) AND lead_state.payment_stuck_alert_sent_at IS NULL -- rama en paralelo a la que consulta Flow (ambas corren, no son excluyentes), colgando del mismo output 'no expirado' de IF payment_link_expired"
        outcomes:
          - "true -> mark_stuck_alert_sent (UPDATE, ANTES de armar/mandar el mensaje, para que quede como maximo UNA alerta por pago durante toda la ventana hasta el expire de 7 dias) -> arma mensaje con lead_id/telefono/flow_order_id/antiguedad -> POST al mismo webhook de Telegram que 'Payment Error Alerts'"
          - "false -> no hace nada"
        note: "Requiere columna nueva lead_state.payment_stuck_alert_sent_at (migracion additive, nullable, aplicada 2026-07-24). Umbral de 24h confirmado con el usuario."

  - workflow: "Payment Error Alerts"
    file: "(workflow nuevo, sin export local todavia -- creado directo via API, id mFtn3WnwBIU0k5uF)"
    purpose: "[NUEVO 2026-07-24] Error Trigger nativo de n8n: cualquier ejecucion fallida en 6.26/6.27/6.28/6.29/6.30 (settings.errorWorkflow apuntando a este id en los 5) dispara este workflow automaticamente, que arma un mensaje con el nombre del workflow/nodo/error y lo manda por Telegram reutilizando el webhook ya existente 'QA Notify via Telegram' (POST https://n8n.aahumada.com/webhook/qa-notify-whatsapp, mismo bot @Vendea_MainReport_bot -- no se duplico el token de Telegram, se reuso el webhook)."
