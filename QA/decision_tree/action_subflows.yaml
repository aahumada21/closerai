    file_modified: "workflows/exports/uncategorized/6.27 - 6.27 payment_confirmed_webhook__id-qogNrpBx2qu6LwYF.json"
  - issue: "[RESUELTO 2026-07-23] 6.27 payment_confirmed_webhook estaba COMPLETAMENTE ROTO desde siempre -- 3 bugs encadenados en el mismo flujo, encontrados recien al probar un pago real de punta a punta contra Flow.cl sandbox por primera vez (nunca antes se habia probado el webhook de confirmacion con un pago genuinamente completado, solo con el status 'not_paid'). Confirmado con la API real de Flow.cl produccion (getStatusByFlowOrder) que las 24 ordenes historicas en lead_state.flow_order_id tienen status=1 (nunca pagadas) y payer=contacto@aahumada.com (email de fallback, no un cliente real) -- son todas de la sesion QA Payment Suite del 13-14 julio, ningun cliente real quedo con un pago sin confirmar, pero el bug en si aplicaba igual a produccion que a sandbox (mismo codigo, solo cambian las credenciales de entorno)."
    detail: |
      Bug 1 -- find_lead_by_order: la query SQL tenia una expresion de n8n corrupta,
      literalmente `WHERE ls.flow_order_id = '{{ \.commerceOrder }}'` (backslash suelto,
      sintaxis invalida, n8n tiraba "invalid syntax" y la ejecucion moria ahi mismo,
      SIEMPRE, para cualquier pago real). Ademas, incluso arreglando solo la sintaxis, el
      campo era el equivocado: la columna flow_order_id guarda flowOrder (numerico, ej.
      8712139 -- confirmado leyendo 6.26/build_payment_message:
      `flowOrderId = String(flowResp.flowOrder || "")`), no commerceOrder.
      Bug 2 -- build_confirmation_msg: pasaba el mensaje a "Call 6.1 send_confirmation"
      con channel/phone/message anidados solo dentro de execution_context, pero
      6.1/validate_outbound_input lee esos 3 campos al nivel raiz de $json
      (`if (!input.channel) throw new Error('Missing channel')`) -- fallaba con
      "Missing channel" siempre. build_payment_message (el equivalente en 6.26, que si
      funciona) ya pone esos campos en la raiz ademas de anidarlos.
      Bug 3 -- build_confirmation_msg (mismo nodo, causa distinta): leia su input via
      `$input.all()`/`$json`, pero su unico nodo previo real es update_payment_confirmed
      -- un UPDATE sin RETURNING, asi que n8n reemplaza $json con el resultado minimo del
      UPDATE, perdiendo lead_id/phone/channel que find_lead_by_order habia juntado
      nodos antes. Con el bug 2 ya arreglado, esto se manifestaba como "Missing phone".
      Bug 4 (menor, no bloqueante) -- a diferencia de 6.26 (que tiene insert_payment_message),
      esta rama de 6.27 nunca insertaba el mensaje "Pago confirmado!" en la tabla
      `messages` -- el mensaje SI se enviaba de verdad por WhatsApp (confirmado
      provider_status:"accepted" de Meta) pero no quedaba en el historial de conversacion.
    fix_applied: |
      Bug 1: query corregida a `WHERE ls.flow_order_id = '{{ $json.flowOrder }}'`.
      Bug 2: build_confirmation_msg ahora arma `{ channel, phone, message: msg,
      execution_context: {...} }` con esos 3 campos tambien en la raiz.
      Bug 3: build_confirmation_msg ahora lee `$("find_lead_by_order").first().json`
      directo (mismo patron ya usado en 6.26/build_payment_message via
      `$("build_flow_signature").first().json`) en vez de confiar en el output del nodo
      Postgres inmediatamente anterior.
      Bug 4: nodo nuevo `insert_confirmation_message` (clon exacto del patron de
      insert_payment_message de 6.26), insertado entre "Call 6.1 send_confirmation" y
      "respond_ok".
      Validado end-to-end con 2 pagos reales completados contra Flow.cl SANDBOX (tarjeta
      de prueba oficial 4051 8856 0044 6623): link generado -> pago -> webhook de
      confirmacion -> mensaje "Pago confirmado!" recibido y persistido -> reintento del
      mismo webhook devuelve already_processed:true sin duplicar el mensaje.
    file_modified: "workflows/exports/uncategorized/6.27 - 6.27 payment_confirmed_webhook__id-qogNrpBx2qu6LwYF.json"
  - issue: "[RESUELTO 2026-07-24] 6.27: el nodo 'HTTP: GET flow getStatus' no tenia manejo de errores -- si Flow.cl respondia con un error (ej. 400 'Transaction not found', que puede pasar por cualquier problema transitorio de red/timing, no solo tokens invalidos) el nodo lanzaba una excepcion no controlada, tumbando TODA la ejecucion y haciendo que el webhook le devolviera HTTP 500 a Flow.cl en vez de 200."
    detail: "Descubierto por un email real de alerta de Flow.cl ('Alerta: Problema de integracion', asunto tipico cuando Flow no recibe HTTP 200 de vuelta) reenviado por el usuario -- coincidia exactamente con la orden 8713187 y el horario en que se estaba debuggeando el bug #2 de esta misma seccion (el de find_lead_by_order), confirmando ademas que ese bug SI afecto un intento real de confirmacion de Flow.cl, no solo pruebas manuales. Reproducido aparte con un token invalido de prueba: efectivamente devolvia HTTP 500."
    fix_applied: "Se seteo onError='continueRegularOutput' en el nodo HTTP -- ahora, si Flow.cl responde con un error, la ejecucion sigue en vez de crashear, y como el JSON de error no tiene un campo 'status'===2, cae naturalmente por la rama existente y segura 'IF payment_confirmed' -> 'respond_not_paid' (que no depende de ningun campo del response, siempre devuelve el mismo `{status:'not_paid',...}` fijo) -- resultando en HTTP 200 con un mensaje coherente en vez de un crash. Se aplico el mismo fix al nodo equivalente en 6.28 check_payment_status por el mismo motivo. Verificado con curl -i: antes HTTP 500, despues HTTP 200."
    file_modified:
      - "workflows/exports/uncategorized/6.27 - 6.27 payment_confirmed_webhook__id-qogNrpBx2qu6LwYF.json"
      - "workflows/exports/uncategorized/6.28 - 6.28 check_payment_status__id-bRPFQVB8uOwaTUyp.json"
  - issue: "[RESUELTO 2026-07-23] payment_preference nunca se seteaba para 'Dale, quiero agendar' (y probablemente otras variantes) en negocios con payment_mode=prepago_only/postpago_only/prepago_required -- por lo que 6.26 (generar link de pago) nunca se llegaba a disparar en el flujo normal de reserva, ni siquiera cuando el negocio esta configurado para prepago."
    detail: "rule_show_me_slots_after_quote (en rules_engine) SI tiene el cuidado de deferir a rule_ask_payment_preference cuando payment_mode==='both' (linea ~1883), pero NO hace nada equivalente para los modos de auto-seleccion (prepago_only/postpago_only/prepago_required) -- simplemente sigue a offer_available_slots sin setear payment_preference. Como esta es la regla que dispara para la frase mas comun de agendar despues de una cotizacion, TODA la semana de pruebas de base/inconsistencia/errores (que usan literalmente 'Dale, quiero agendar') nunca genero ni una sola orden real de pago, aunque la reserva se confirmara bien -- confirmado root-causeando un escenario QA de pagos que llego hasta confirm_booking pero lead_state.payment_preference/flow_order_id quedaron vacios."
    fix_applied: "En vez de parchar cada regla individual que pudiera llegar a offer_available_slots sin pasar por el auto-select de pago (fragil, dificil de garantizar exhaustividad), se agrego una red de seguridad en el UNICO punto donde realmente se decide si 6.26 se llama: extract_booking_confirm_result (en action_executor, justo antes del nodo IF payment_preference_prepago). Si payment_preference llega vacio, se deriva de payment_mode (mismo criterio que usa rule_ask_payment_preference para sus ramas de auto-seleccion): prepago_only/prepago_required -> 'prepago', postpago_only -> 'postpago'. Para payment_mode='both' se deja vacio a proposito (ahi si se requiere una eleccion explicita del cliente)."
    file_modified: "workflows/exports/uncategorized/6 - 6 action_executor__id-80e7685e-2690-4d1e-a5e7-5ccb7d0e8a13.json"
  - issue: "[RESUELTO 2026-07-18] 8.0 human_handof / assign_handoff_owner: el chequeo de 'reclamo' en el texto se evaluaba ANTES que el chequeo de stage in [closing,quoted]; como no habia early-return, un lead en stage closing/quoted que ademas escribia algo con 'reclamo' terminaba con assigned_team='ventas' (el chequeo de stage pisaba el de reclamo), no 'soporte'."
    fix_applied: "El segundo if se convirtio en 'else if', asi que reclamo siempre gana sin importar el stage -- mismo patron de 'primer match gana' que se usa en rules_engine."
    file_modified: "workflows/exports/uncategorized/8.0 - 8.0 human_handof__id-2360b175-88ae-483d-8551-b2aa36c1c625.json"

flows:
  - workflow: "6.0 resolve_pricing_from_db"
    file: "workflows/exports/uncategorized/6.0 - 6.0 resolve_pricing_from_db__id-72b60f14-db90-436e-b48c-02b96dd4f946.json"
    purpose: "Dado servicio+vehiculo+comuna (o solo vehiculo+comuna para lista completa), calcula el precio real consultando la version de tarifas activa del negocio en la DB (precio base + recargo por comuna)."
    branch_points:
      - node: "normalize_pricing_keys"
        type: code_branch
        condition: "!agentId / (!vehicle || !district) tras canonicalizar"
        outcomes:
          - "throw Error('Missing pricing inputs: agent_id is required')"
          - "throw Error('Missing pricing inputs: vehicle=..., district=...')"
          - "pasa -> price_list_requested = !service (no se resolvio un service_code)"
      - node: "normalize_pricing_keys (price_list_requested)"
        type: code_branch
        condition: "!service"
        outcomes:
          - "true -> modo lista de precios"
          - "false -> modo cotizacion unica"
      - node: "build_pricing_result"
        type: code_branch
        condition: "price_list_requested === true"
        outcomes:
          - "modo lista: success/pricing_found = (priceList.length > 0)"
          - "modo unico: success=true/pricing_found=true siempre, arma quote{base_price,surcharge,price}"
      - node: "IF pricing_found"
        type: if
        condition: "pricing_found===true && (Number(final_price)>0 || (price_list_requested===true && price_list.length>0))"
        outcomes:
          - "true -> build_pricing_result"
          - "false -> build_pricing_not_found (error_code: pricing_rule_not_found)"

  - workflow: "6.1 send_outbound_message"
    file: "workflows/exports/uncategorized/6.1 - 6.1 send_outbound_message__id-a0d615e2-41de-4f01-bb5a-2a5bee00d803.json"
    purpose: "Punto unico de salida de mensajes del bot: valida el mensaje, rutea segun canal (WhatsApp real via Cloud API, o simulado para n8n_chat/webchat) y normaliza la respuesta del proveedor. Todo lo que el bot 'dice' pasa por aca."
    branch_points:
      - node: "validate_outbound_input"
        type: code_branch
        condition: "chequeos secuenciales sobre channel/phone/message"
        outcomes:
          - "throw Error('Missing channel')"
          - "throw Error('Unsupported channel: ' + channel) -- permitidos: whatsapp, n8n_chat, webchat"
          - "throw Error('Missing phone')"
          - "throw Error('Invalid message')"
          - "throw Error('Phone must be Chile format (56...)') -- solo canal whatsapp"
          - "throw Error('Invalid message after mojibake fix')"
          - "pasa -> {phone, message} normalizados"
      - node: "channel_router (switch)"
        type: switch
        condition: "({whatsapp:0, n8n_chat:1, webchat:2})[$json.channel] ?? -1"
        outcomes:
          - "whatsapp -> output 0 (WB Send, llamada real a WhatsApp Cloud API)"
          - "n8n_chat -> output 1 (build_n8n_chat_response, simulated_delivery:true, no envia de verdad)"
          - "webchat -> output 2 (build_webchat_response, simulated_delivery:true, no envia de verdad)"
          - "canal no reconocido -> -1, sin salida (dead end, en la practica inalcanzable porque validate_outbound_input ya filtro el allowlist)"
      - node: "normalize_provider_response"
        type: code_branch
        condition: "providerResponse.error !== undefined (solo camino whatsapp)"
        outcomes:
          - "sin error -> success=true, message_sent=true, provider_status='accepted'"
          - "con error -> success=false, message_sent=false, provider_status='failed'"

  - workflow: "6.2 check_calendar_slot"
    file: "workflows/exports/uncategorized/6.2 - 6.2 check_calendar_slot__id-9b16489e-ce39-4213-ab5d-270d035fa1e0.json"
    purpose: "Verifica si un horario puntual (fecha+hora exacta) esta realmente libre en Google Calendar antes de confirmarlo -- lo llaman 6.5, 6.10 y 6.23 cada vez que hay que revalidar un slot especifico."
    branch_points:
      - node: "build_slot_range"
        type: code_branch
        condition: "booking_date/booking_time/slot_id faltantes; duration_minutes invalido; parseo DateTime invalido"
        outcomes:
          - "throw Error('Faltan datos requeridos: booking_date, booking_time o slot_id')"
          - "throw Error('duration_minutes invalido')"
          - "throw Error('Fecha/hora invalida: ...')"
          - "pasa -> slot_start_at/slot_end_at calculados"
      - node: "IF oauth_connected"
        type: if
        condition: "$json.oauth_connected === true"
        outcomes:
          - "true -> get_events_oauth (httpRequest, token OAuth) -> split_oauth_events"
          - "false -> nodo credencial Google Calendar por defecto"
      - node: "split_oauth_events"
        type: code_branch
        condition: "response.items.length === 0 (solo camino oauth)"
        outcomes:
          - "vacio -> emite un evento sintetico nulo (mantiene viva la ejecucion de n8n)"
          - "no vacio -> mapea cada evento real"
      - node: "normalize_slot_check"
        type: code_branch
        condition: "filtra eventos con summary que contiene 'cliente qa' (artefactos de test), luego hasEvents = realEvents.length > 0"
        outcomes:
          - "slot_available=true -- no hay eventos en conflicto"
          - "slot_available=false -- conflicting_events_count > 0"

  - workflow: "6.3 create_calendar_booking"
    file: "workflows/exports/uncategorized/6.3 - 6.3 create_calendar_booking__id-a3ec1c2d-0a59-46b1-a404-7a990234f3dc.json"
    purpose: "Crea el evento real en Google Calendar para una reserva ya confirmada (llamado exclusivamente por 6.5 confirm_booking_executor)."
    branch_points:
      - node: "build_calendar_event_payload"
        type: code_branch
        condition: "slot_start_at/slot_end_at/service_interest/lead_id faltantes; fechas ISO invalidas; end<=start"
        outcomes:
          - "throw Error('Faltan datos requeridos: slot_start_at, slot_end_at, service_interest o lead_id')"
          - "throw Error('slot_start_at o slot_end_at tienen formato invalido')"
          - "throw Error('slot_end_at debe ser mayor que slot_start_at')"
          - "pasa -> arma summary/description/location del evento"
      - node: "IF oauth_connected"
        type: if
        condition: "$json.oauth_connected === true"
        outcomes:
          - "true -> create_event_oauth (httpRequest, token OAuth)"
          - "false -> nodo credencial Google Calendar por defecto"
    note: "sin branch por fallo de creacion dentro de este sub-workflow -- el exito/fallo lo evalua el LLAMADOR (6.5, IF calendar_creation_failed)."

  - workflow: "6.4 list_available_slots"
    file: "workflows/exports/uncategorized/6.4 - 6.4 list_available_slots__id-1e882e96-85ef-4afa-8619-8a7bf5f52376.json"
    purpose: "Genera los horarios candidatos segun el schedule del negocio/staff y los filtra contra los eventos ya ocupados (DB de reservas + Google Calendar), devolviendo la lista final de slots realmente disponibles."
    branch_points:
      - node: "normalize_availability_input"
        type: code_branch
        condition: "!leadId"
        outcomes:
          - "throw Error('Missing lead_id')"
          - "pasa"
      - node: "generate_candidate_slots (origen del horario)"
        type: code_branch
        condition: "input.schedule es array con >=1 regla que pasa isValidScheduleRule()"
        outcomes:
          - "schedule de negocio/staff valido -> se usa"
          - "sin schedule valido -> fallback a DEFAULT_SCHEDULE (martes+jueves 09:00, domingo 09:00-15:00 cada 6h)"
      - node: "generate_candidate_slots (candidatos encontrados)"
        type: code_branch
        condition: "candidates.length === 0 tras escanear la ventana startOffsetDays..+daysAhead+14"
        outcomes:
          - "sin candidatos futuros -> candidate_slots: []"
          - "encontrados -> candidate_slots poblado (tope maxSlots+10 durante el escaneo)"
      - node: "IF oauth_connected"
        type: if
        condition: "$json.oauth_connected === true"
        outcomes:
          - "true -> get_busy_events_oauth (httpRequest) -> split_oauth_busy_events"
          - "false -> nodo por defecto de eventos ocupados"
      - node: "split_oauth_busy_events"
        type: code_branch
        condition: "response.items.length === 0 (solo camino oauth)"
        outcomes:
          - "vacio -> evento sintetico nulo"
          - "no vacio -> mapea eventos reales"
      - node: "filter_available_slots"
        type: code_branch
        condition: "excluye eventos 'cliente qa' (DB y calendario), luego filtra candidate_slots cuyo [start,end) se solapa con algun evento ocupado restante (DB appointments_db O google_calendar)"
        outcomes:
          - "availableSlots no vacio (hasta max_slots) -- se ofrecen al cliente"
          - "availableSlots vacio -- todos los candidatos chocan; slots:[] pero success:true igual (el llamador/6.23 decide el mensaje para el caso vacio)"

  - workflow: "6.5 confirm_booking_executor"
    file: "workflows/exports/uncategorized/6.5 - 6.5 confirm_booking_executor__id-c4f365f3-8df3-49b1-8c88-8f4849fe1dd9.json"
    purpose: "Orquesta la confirmacion final de una reserva de punta a punta: exige direccion confirmada, evita duplicados concurrentes con un lock, revalida que el horario elegido siga libre, crea el evento en Google Calendar, inserta la fila en DB, y maneja cada punto de fallo posible en esa cadena (slot tomado, error de calendario, error de insert)."
    note: "El sub-flujo con mas ramas de todo action_executor -- concentra casi todo el riesgo operacional de la reserva."
    branch_points:
      - node: "normalize_confirm_booking_input"
        type: code_branch
        condition: "lead_id/channel/booking_date/booking_time faltantes tras resolver desde execution_context/context_packet/decision.state_update"
        outcomes:
          - "throw Error('Missing execution_context.lead_id')"
          - "throw Error('Missing execution_context.channel')"
          - "throw Error('Missing execution_context.booking_date')"
          - "throw Error('Missing execution_context.booking_time')"
          - "pasa"
      - node: "IF lock_acquired"
        type: if
        condition: "!!$json.lock_lead_id (resultado de acquire_booking_lock, insert tipo advisory-lock en Postgres)"
        outcomes:
          - "true -> sigue a guard_booking_requires_address (flujo principal)"
          - "false -> build_booking_already_in_progress -- 'Tu reserva ya quedo registrada...' (llamada concurrente duplicada bloqueada, sin escrituras a DB)"
      - node: "guard_booking_requires_address / route_address_guard (switch de 3 vias)"
        type: code_branch + switch
        condition: "!serviceAddress -> 'collect_address'; sino !addressConfirmed -> 'confirm_address'; sino -> 'continue_booking'"
        outcomes:
          - "collect_address -> build_collect_address_result -- pide direccion exacta, stage=collecting_address, retorna de inmediato"
          - "confirm_address -> build_confirm_address_result -- pide confirmar direccion en archivo, stage=address_confirmation, retorna de inmediato"
          - "continue_booking -> sigue a check_appointment (chequeo de reserva existente en DB)"
      - node: "IF appointment_exists"
        type: if
        condition: "!!$json.id (check_appointment, query Postgres de reserva activa existente)"
        outcomes:
          - "true -> build_existing_appointment_result -- 'Ya tienes una reserva activa...', retorna sin crear nada nuevo"
          - "false -> llama a '6.2 check_calendar_slot' para verificar que el horario elegido sigue libre"
        known_gaps:
          - issue: "[RESUELTO 2026-07-25] Bug real reportado por el usuario: cliente con una reserva activa (auto 1, SUV) intento agendar un SEGUNDO lavado para 'mi otro auto' (hatchback) en un horario DISTINTO. check_appointment original solo chequeaba 'existe ALGUNA cita activa para este lead_id', sin comparar contra el horario que se esta confirmando ahora -- encontro la reserva del auto 1 y la trato como si fuera la MISMA reserva, devolviendo 'Ya tienes una reserva activa...' y NUNCA creando la fila de appointments/evento de calendario para el auto 2, aunque el cliente pago de verdad el link de Flow generado para esa 2da reserva (confirmado: notes=['active_appointment_exists'], db_records_created=['messages'] -- sin 'appointments')."
            fix_applied: "Query de check_appointment ahora exige ademas 'AND start_at = (booking_date+booking_time convertido a America/Santiago)' -- es decir, solo se considera 'ya existe' si hay una cita activa para ESE MISMO horario especifico que se esta confirmando (protege contra doble-submit del mismo slot), no para cualquier cita del lead en cualquier horario. Esto permite que un mismo lead tenga multiples reservas activas simultaneas para horarios distintos (ej. 2 autos, 2 turnos)."
      - node: "IF slot_available"
        type: if
        condition: "$json.slot_available (resultado de 6.2 check_calendar_slot)"
        outcomes:
          - "true -> llama a '6.3 create_calendar_booking' (crea el evento en GCal)"
          - "false -> build_slot_unavailable_result -- 'Ese horario ya no esta disponible', reofrece hasta 3 alternativas de booking_options excluyendo la elegida, stage vuelve a booking_selection"
      - node: "IF calendar_creation_failed"
        type: if
        condition: "!!$json.error || (!calendar_event?.id && !$json.id)"
        outcomes:
          - "true -> build_calendar_creation_failed_result -- error generico 'No pude confirmar la reserva...'"
          - "false -> merge_calendar_result_with_context -> build_real_appointment_payload -> insert_appointment (insert en DB)"
      - node: "IF appointment_insert_failed"
        type: if
        condition: "!!$json.error (resultado del insert_appointment en Postgres)"
        outcomes:
          - "true -> build_appointment_insert_failed_result -- 'La reserva en agenda se creo, pero hubo un problema al registrarla internamente' (estado de fallo parcial: existe evento GCal pero no fila en DB)"
          - "false -> build_booking_confirmation_message (mensaje final de exito, stage=booked) -> encadena a 6.13 send_pre_service_instruction, combina mensajes, crea DB_Create_Appointment_Followups"

  - workflow: "6.6 cancel_booking"
    file: "workflows/exports/uncategorized/6.6 - 6.6 cancel_booking__id-776d144a-7bf8-472c-9d6a-1bbc711872ea.json"
    purpose: "Cancela la reserva activa de un lead: borra el evento de Google Calendar, marca la fila como cancelled en DB, cancela followups pendientes, y opcionalmente re-ofrece horarios de una si es parte de un flujo de cambio-de-servicio (cancelar+reagendar)."
    branch_points:
      - node: "normalize_cancel_booking_input"
        type: code_branch
        condition: "!lead_id tras resolver desde execution_context/context_packet.lead.id"
        outcomes:
          - "throw Error('Missing lead_id in cancel_booking')"
          - "pasa"
      - node: "IF active_appointment_exists"
        type: if
        condition: "!!$json.id (DB_Check_Active_Appointment_For_Cancel)"
        outcomes:
          - "false -> build_cancel_no_active_result -- 'No encontre una reserva activa a tu nombre...', sin mutaciones, next_goal=offer_booking"
          - "true -> borra evento GCal, marca appointment como cancelled, cancela followups, luego build_cancel_booking_result"
      - node: "IF auto_offer_slots_after_cancel"
        type: if
        condition: "execution_context?.auto_offer_slots_after_cancel === true"
        outcomes:
          - "true -> llama a '6.23 offer_available_slots', antepone 'Listo, cancele tu reserva anterior.' al mensaje de horarios (flujo de cambio-de-servicio: cancelar+reagendar)"
          - "false -> build_cancel_booking_result directo -- confirmacion simple de cancelacion, stage='cancelled'"
      - node: "normalize_cancel_booking_result"
        type: code_branch
        condition: "outcome derivado de active_appointment_found/appointment===null, mas presencia de combined_cancel_message"
        outcomes:
          - "outcome=no_active_appointment -- next_goal='clarify_or_book'"
          - "outcome=active_appointment_found sin combined_cancel_message -- stage='qualified', limpia booking_date/time/slot_id/booking_options/availability_confirmed, next_goal='reactivation'"
          - "outcome=active_appointment_found con combined_cancel_message (camino auto-offer) -- no reescribe stage/campos, solo normaliza missing_fields"

  - workflow: "6.7 ask_missing_data"
    file: "workflows/exports/uncategorized/6.7 - 6.7 ask_missing_data__id-6c5dad2d-492a-4ce1-966f-e36147b43100.json"
    purpose: "Envia al usuario el mensaje que pide un dato faltante especifico -- el texto ya viene armado por rules_engine o llm_decision, este sub-flujo solo lo despacha via 6.1."
    branch_points: []
    note: >
      Sin puntos de decision reales -- message_to_send siempre es execution_context.message
      (armado aguas arriba por rules_engine/llm_decision), pasado sin condicion. El unico
      condicional interno es una cadena de fallback de 3 niveles para elegir missing_fields
      del state_update; afecta solo el registro de estado, no el mensaje ni el camino del bot.

  - workflow: "6.8 send_quote"
    file: "workflows/exports/uncategorized/6.8 - 6.8 send_quote__id-48860882-12ae-40c1-be93-c9778cade549.json"
    purpose: "Cotiza el servicio llamando a 6.0 resolve_pricing_from_db y envia el mensaje de precio correspondiente (lista completa de servicios o cotizacion puntual). Si el pricing falla, deriva a humano en vez de reintentar."
    branch_points:
      - node: "IF pricing_found1"
        type: if
        condition: "$json.pricing_found===true || ($json.success===true && (quote?.base_price || price_list.length>0)) -- resultado de la sub-llamada a '6.0 resolve_pricing_from_db'"
        outcomes:
          - "true -> build_quote_message"
          - "false -> build_pricing_unavailable_result -- fuerza stage='human_handoff', human_handoff=true (fallo de pricing deriva a humano en vez de reintentar)"
      - node: "build_quote_message"
        type: code_branch
        condition: "price_list es array con length>0"
        outcomes:
          - "modo lista de precios -- lista cada servicio+precio para el vehiculo/comuna, stage='quoted', next_goal='choose_service_or_book'"
          - "modo cotizacion unica -- mensaje de un servicio con CTA de reserva, stage='quoted', next_goal='book_appointment'; throw Error('Missing resolved quote') si no hay ni price_list ni quote.price"

  - workflow: "6.9 answer_question"
    file: "workflows/exports/uncategorized/6.9 - 6.9 answer_question__id-ce882890-6ea3-4784-879d-b1e1b4f8c5e9.json"
    purpose: "Envia una respuesta generica/informativa ya armada aguas arriba (rules_engine o el LLM) -- es el 'catch-all' de mensajeria para todo lo que no encaja en una accion mas especifica (FAQs, aclaraciones, disclosures, etc.)."
    file_note: "Hay un archivo duplicado con id efe50346-2d38-4d11-8cd0-3694db16a8e3 que NO tiene entrada en workflows.inventory.json (huerfano, ni siquiera inactivo) -- se ignoro; este id (ce882890) es el que 6 action_executor realmente llama."
    branch_points: []
    note: "Sin puntos de decision reales -- pass-through lineal. message_to_send siempre es execution_context.message; state_update.missing_fields solo se traspasa (chequeo Array.isArray, sin bifurcacion de comportamiento)."

  - workflow: "6.10 reschedule_booking"
    file: "workflows/exports/uncategorized/6.10 - 6.10 reschedule_booking__id-ece2fbb8-75d2-4496-9f6d-5bcb5abcdb40.json"
    purpose: "Reprograma la reserva activa de un lead: si no vino un horario nuevo explicito, lista alternativas via 6.4; si vino uno, lo revalida via 6.2 y actualiza el evento existente en Google Calendar."
    branch_points:
      - node: "normalize_reschedule_input"
        type: code_branch
        condition: "genericRescheduleRequest (decision.reason==='user_requested_reschedule' O next_goal==='collect_new_slot' O intent_last==='reschedule_booking_requested') Y !hasExplicitNewSlot (sin booking_date+time ya dados)"
        outcomes:
          - "shouldListNewSlots=true: fuerza booking_date/time/slot_id a null, next_goal='collect_selected_slot' -> obliga a listar horarios"
          - "shouldListNewSlots=false: mantiene booking_date/time/slot_id existentes (ya vino un horario nuevo explicito) -> va directo a chequear disponibilidad"
      - node: "IF active_appointment_exists"
        type: if
        condition: "!!$json.active_appointment?.id"
        outcomes:
          - "true -> sigue a chequear has_new_slot / listar horarios / actualizar calendario"
          - "false -> build_reschedule_no_active_message -- 'No encontre una reserva activa para reprogramar...', next_goal='offer_booking'"
      - node: "IF has_new_slot"
        type: if
        condition: "!!$json.booking_date && !!$json.booking_time"
        outcomes:
          - "true -> salta el listado, va directo a '6.2 check_calendar_slot'"
          - "false -> llama a '6.4 list_available_slots' -> build_reschedule_slots_message"
      - node: "build_reschedule_slots_message"
        type: code_branch
        condition: "slots.length === 0 (devuelto por 6.4)"
        outcomes:
          - "0 slots: mensaje 'no encontre horarios disponibles...', next_goal='manual_availability_review', last_bot_action='reschedule_no_slots_found'"
          - ">0 slots: lista numerada de opciones, next_goal='collect_selected_slot', last_bot_action='offer_reschedule_slots'"
      - node: "IF slot_available"
        type: if
        condition: "$json.slot_available === true || $json.availability_confirmed === true"
        outcomes:
          - "true -> sigue a Google Calendar Update Event (se reprograma)"
          - "false -> build_reschedule_slot_unavailable_message -- 'Ese horario ya no esta disponible...', next_goal='collect_new_slot'"
      - node: "normalize_reschedule_booking_result"
        type: code_branch
        condition: "clasificacion derivada del last_bot_action / presencia de message+booking_options: isSlotListResponse | isSlotUnavailable | isNoActive | isSuccess"
        outcomes:
          - "isSlotListResponse -> outcome='reschedule_slots_offered'"
          - "isSlotUnavailable -> outcome='reschedule_slot_unavailable'"
          - "isNoActive -> outcome='no_active_appointment'"
          - "isSuccess -> outcome='reschedule_confirmed'"
          - "ninguno matchea -> fallback a data.outcome/execution_result.outcome/result.outcome o 'reschedule_processed'"

  - workflow: "6.11 collect_address"
    file: "workflows/exports/uncategorized/6.11 - 6.11 collect_address__id-0c7ab410-ad24-4d54-8a30-0e28b00d3651.json"
    purpose: "Pide al usuario la direccion exacta donde se realizara el servicio (mencionando la comuna si ya se conoce)."
    branch_points:
      - node: "build_collect_address_result"
        type: code_branch
        condition: "comuna conocida vs desconocida (district/execution_context.district/context_packet.state.district)"
        outcomes:
          - "comuna conocida: mensaje menciona la comuna por nombre"
          - "comuna desconocida: mensaje generico sin mencionarla"
    note: "Nodo Code lineal por lo demas -- siempre stage='collecting_address', missing_fields=['address']. La logica mas rica (handoff por intentos agotados, chequeo de numero faltante) vive en rules_engine (ruleConfirmAddressIfWaitingAddress), no aca."

  - workflow: "6.12 confirm_address"
    file: "workflows/exports/uncategorized/6.12 - 6.12 confirm_address__id-65759df4-4c07-45f3-88f5-e972faf3304f.json"
    purpose: "Valida la direccion recibida (largo minimo plausible, comuna presente) y, si esta completa, avanza a confirmar el horario elegido o a pedir que se elija uno."
    branch_points:
      - node: "confirm_address_logic"
        type: code_branch
        condition: "!normalizedAddress || normalizedAddress.length < 8 (direccion ausente o demasiado corta para ser plausible)"
        outcomes:
          - "true: re-pide direccion exacta, stage sigue 'collecting_address', last_bot_action='collect_address'"
          - "false: sigue al chequeo de comuna"
      - node: "confirm_address_logic"
        type: code_branch
        condition: "(direccion valida) && !district"
        outcomes:
          - "true: pide confirmar la comuna, stage='collecting_address', missing_fields=['district']"
          - "false: sigue a la rama de confirmacion final"
      - node: "confirm_address_logic"
        type: code_branch
        condition: "(direccion valida) && (comuna presente) -> sub-rama sobre bookingDate && bookingTime"
        outcomes:
          - "bookingDate && bookingTime presentes: pide confirmar la reserva para esa fecha/hora, next_goal='confirm_booking'"
          - "bookingDate/bookingTime ausentes: 'ahora necesito que elijas un horario disponible', next_goal='send_available_slots'"

  - workflow: "6.13 send_pre_service_instruction"
    file: "workflows/exports/uncategorized/6.13 - 6.13 send_pre_service_instruction__id-a9a040b3-31c0-459b-9c5e-aead2f7b9d28.json"
    purpose: "Envia el checklist de instrucciones previas al servicio (que dejar listo, accesos, etc.) para la reserva activa de un lead."
