known_gaps:
  - issue: "[RESUELTO 2026-07-18] 6.26 payment_request: el nodo HTTP 'POST flow/payment/create' tiene 2 salidas (exito/error). La rama de error armaba build_payment_error (mensaje 'Hubo un problema al generar el link de pago...') pero ese nodo NO TENIA CONEXION DE SALIDA en el grafo exportado -- el mensaje de error se construia pero nunca se enviaba a nadie."
    fix_applied: "build_payment_error se reescribio para tomar el contexto real desde build_flow_signature (channel/phone) en vez de confiar en el shape del output de error del HTTP node, y se agrego un nodo nuevo 'Call 6.1 send_payment_error_message' (clon de 'Call 6.1 send_payment_message', mismo workflowId de 6.1) conectado a build_payment_error -- deliberadamente un nodo separado (no el compartido) para no arrastrar la rama de error por insert_payment_message/update_lead_state_payment_pending, que son bookkeeping exclusivo del camino de exito."
