  - workflow: "6.17 send_service_menu"
    file: "workflows/exports/uncategorized/6.17 - 6.17 send_service_menu__id-e974cd1e-5cf1-4634-9e86-9628cab0c1a5.json"
    purpose: "Envia el menu de servicios del negocio (custom desde agent_business_config o el default de 3 servicios de Ahumada), pidiendo vehiculo+comuna si el negocio requiere ese contexto para cotizar."
