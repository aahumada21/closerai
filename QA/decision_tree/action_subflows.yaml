  - issue: "[RESUELTO 2026-07-18] 6.27 payment_confirmed_webhook: no habia guard de idempotencia. update_payment_confirmed no filtraba WHERE payment_status<>'paid', y find_lead_by_order no excluia leads ya pagados."
