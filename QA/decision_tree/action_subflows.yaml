  - workflow: "6.28 check_payment_status"
    file: "workflows/exports/uncategorized/6.28 - 6.28 check_payment_status__id-bRPFQVB8uOwaTUyp.json"
    purpose: "[Agregado 2026-07-24] Cuando el cliente pregunta si su pago se registro, consulta EN VIVO la API real de Flow.cl (nunca confia solo en lead_state.payment_status local). Si Flow dice pagado pero la DB local no, se auto-cura llamando a su propio webhook de confirmacion (mismo que Flow.cl llama) para que 6.27 procese todo (mensaje + DB) de forma idempotente antes de responder."
    branch_points:
      - node: "interpret_and_build_result"
        type: code_branch
        condition: "flowStatus (numerico, de payment/getStatusByFlowOrder): 1=pendiente, 2=pagado, 3=rechazado, 4=anulado"
        outcomes:
          - "sin flow_order_id en absoluto -> mensaje directo 'No tengo ningun pago pendiente registrado a tu nombre', sin llamar a Flow"
          - "2 (pagado) Y local_payment_status ya es 'paid' -> mensaje de confirmacion simple, sin self-heal"
          - "2 (pagado) Y local_payment_status NO es 'paid' -> needs_self_heal=true, message vacio (6.27 manda su propio mensaje de confirmacion via el self-heal)"
          - "1 (pendiente) -> mensaje explicando que aun no se registra, reenvia el link de pago guardado"
          - "3 (rechazado) -> mensaje ofreciendo generar un link nuevo"
          - "4 (anulado) -> mensaje ofreciendo generar un link nuevo"
      - node: "IF needs_self_heal"
        type: if
        condition: "$json.needs_self_heal === true"
        outcomes:
          - "true -> POST a su propio /webhook/flow-payment-confirmed con el token (extraido de flow_payment_url guardado, no hay columna dedicada para el token crudo) -- reutiliza 100% la logica ya arreglada y probada de 6.27, incluyendo su guard de idempotencia"
          - "false -> pasa directo a finalize_result"
    note: "Validado 2026-07-24 contra Flow.cl sandbox real: la rama 'pendiente' confirmada end-to-end (respuesta correcta, incluye el link de pago). Las ramas 'ya pagado' y 'self-heal' comparten el mismo bloque if/else revisado a mano pero no se forzaron con una prueba dedicada aparte (hubiera requerido un tercer pago sandbox real)."

  - workflow: "6.27 payment_confirmed_webhook"
    file: "workflows/exports/uncategorized/6.27 - 6.27 payment_confirmed_webhook__id-qogNrpBx2qu6LwYF.json"
    purpose: "Webhook que recibe la notificacion de pago de Flow.cl, re-verifica el estado real contra la API (no confia ciegamente en el webhook), y si esta pagado crea la reserva pendiente (via 6.5) y notifica al cliente -- con guard de idempotencia para webhooks duplicados."
    branch_points:
      - node: "IF payment_confirmed"
        type: if
        condition: "$json.status === 2 (status numerico de Flow.cl GET payment/getStatus; 2=pagado)"
        outcomes:
          - "true -> find_lead_by_order -> [RESUELTO 2026-07-18] 'IF already_paid' -> update_payment_confirmed -> build_confirmation_msg (cualquier otro status -- pendiente, rechazado, cancelado -- cae todo junto en la rama false, sin distinguirse entre si)"
          - "false -> respond_not_paid: {status:'not_paid'} -- retorna de inmediato, sin buscar/actualizar el lead"
      - node: "IF already_paid [RESUELTO 2026-07-18]"
        type: if
        condition: "$json.payment_status === 'paid' (nuevo, campo agregado al SELECT de find_lead_by_order)"
        outcomes:
          - "true (ya estaba pagado, webhook duplicado) -> respond_already_processed: {status:'ok', already_processed:true} -- no re-envia mensajes ni re-crea la reserva"
          - "false (primera confirmacion) -> update_payment_confirmed (que ademas ahora tiene 'AND payment_status IS DISTINCT FROM 'paid'' como defensa extra) -> build_confirmation_msg"
      - node: "build_confirmation_msg"
        type: code_branch
        condition: "isPrepagoreRequired: pending_booking_data.payment_mode==='prepago_required' O (pending_booking presente && pending_booking.lead_id presente)"
        outcomes:
          - "true + pendingBooking: 'Pago confirmado! ... Tu turno para {fecha} a las {hora} esta reservado.'; action='confirm_booking_after_payment'; has_pending_booking=true"
          - "false (o sin pendingBooking): 'Pago confirmado! ... Tu reserva esta asegurada.'; action='payment_confirmed'; has_pending_booking=false"
      - node: "IF has_pending_booking"
        type: if
        condition: "$json.has_pending_booking === true"
        outcomes:
          - "[CAMBIADO 2026-07-24] true -> confirm_pending_payment_appointment (UPDATE appointments SET status='confirmed' sobre la fila que YA existe con status='pending_payment', creada al momento de confirmar la reserva -- ver known_gaps 'reserva del cupo prepago_required') -> update_lead_state_stage_booked (UPDATE lead_state SET stage='booked'; antes esto vivia en update_lead_state_after_booking con una expresion n8n rota '{{ \\.execution_context.lead_id }}' que nunca matcheaba ningun lead -- bug real, arreglado aca) -> restore_confirmation_payload_for_send -> converge en 'Call 6.1 send_confirmation' (mismo nodo que la rama false) -> insert_confirmation_message -> respond_ok. Ya NO llama a 6.5 (el evento de calendario y la fila de appointments se crean antes, en action_executor, no aca)."
          - "false -> solo envia confirmacion simple de pago (sin crear GCal aca) -> Call 6.1 send_confirmation -> respond_ok"
      - node: "build_post_payment_msg"
        type: code_branch
        condition: "originalMsg (execution_context.original_payment_message) presente/truthy"
        outcomes:
          - "presente -> finalMsg = 'Pago recibido!' + bookingMsg"
          - "ausente -> finalMsg = bookingMsg solo"
    note: "[RESUELTO 2026-07-18] Ver known_gaps arriba: se agrego guard de idempotencia (IF already_paid) en el camino de confirmacion de pago."
